[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "penpal-backend"
version = "0.1.0"
description = "PenPal backend: AI-assisted security assessment platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy[asyncio]==2.0.36",
    "alembic==1.14.0",
    "asyncpg==0.30.0",
    "aiosqlite==0.20.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.6.1",
    "email-validator==2.2.0",
    "PyJWT==2.10.1",
    "argon2-cffi==23.1.0",
    "httpx==0.28.1",
    "defusedxml==0.7.1",
    "Jinja2==3.1.5",
    "weasyprint==63.1",
    "python-multipart==0.0.20",
    "cryptography==44.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "pytest-cov==6.0.0",
    "ruff==0.8.4",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.j2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:passlib.*",
    "ignore::DeprecationWarning:argon2.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "C4", "SIM", "RUF"]
ignore = [
    "S101",   # asserts in tests
    "S104",   # binding to all interfaces is handled by container config
    "B008",   # FastAPI dependency defaults
    "RUF012", # ClassVar annotations are not worth the noise here
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311", "SIM117"]
"scripts/*" = ["S105", "S106"]

[tool.coverage.run]
source = ["app"]
branch = true
